<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free thẻ Garena</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #111827, #2563eb, #7c3aed);
    background-size: 300% 300%;
    animation: bg 8s ease infinite;
    color: white;
}

@keyframes bg {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    width: 90%;
    max-width: 420px;
}

/* Màn hình chào */
.welcome {
    text-align: center;
    padding: 35px 25px;
    border-radius: 25px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.welcome h1 {
    font-size: 27px;
    margin-bottom: 15px;
}

.welcome p {
    color: #ddd;
    margin-bottom: 25px;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 14px;
    padding: 14px 20px;
    transition: .2s;
}

button:active {
    transform: scale(.95);
}

.continue {
    width: 100%;
    background: #2563eb;
}

.continue:hover {
    background: #1d4ed8;
}

/* Nội dung chính */
.main {
    display: none;
    text-align: center;
    padding: 35px 25px;
    border-radius: 25px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.main h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    color: #ddd;
    margin-bottom: 25px;
}

.cards {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.claim {
    width: 100%;
    background: linear-gradient(135deg, #16a34a, #22c55e);
}

.claim:hover {
    filter: brightness(1.1);
}

.received {
    display: none;
    padding: 18px;
    border-radius: 15px;
    background: rgba(255,255,255,.1);
    color: #86efac;
    font-weight: bold;
    font-size: 17px;
}
</style>
</head>

<body>

<div class="container">

    <!-- MÀN HÌNH CHÀO -->
    <div class="welcome" id="welcome">
        <h1>👋 Chào mừng bạn!</h1>

        <p>
            Chào mừng bạn đến với web của
            <b>Văn Kiều đẹp trai</b> 😎
        </p>

        <button class="continue" onclick="enterWeb()">
            Tiếp tục 🚀
        </button>
    </div>


    <!-- TRANG CHÍNH -->
    <div class="main" id="main">

        <h1>🎁 Free thẻ Garena</h1>

        <p class="subtitle">
            Chọn một phần quà bên dưới
        </p>

        <div class="cards" id="cards">

            <button class="claim" onclick="claimGift(this, '12')">
                🎫 Sao chép 12
            </button>

            <button class="claim" onclick="claimGift(this, '13')">
                🎫 Sao chép 13
            </button>

        </div>

        <div class="received" id="received">
            ✅ Đã có người nhận
        </div>

    </div>

</div>


<script>

function enterWeb() {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("main").style.display = "block";
}


function claimGift(button, number) {

    /*
       Đây chỉ là ví dụ sao chép số 12 hoặc 13.
       Bạn có thể thay bằng mã thẻ thật của mình.
    */

    const text = number;

    navigator.clipboard.writeText(text)
        .then(() => {

            // Ẩn nút vừa nhận
            button.style.display = "none";

            // Hiện thông báo
            document.getElementById("received").style.display = "block";

        })
        .catch(() => {

            // Nếu trình duyệt không cho sao chép
            button.style.display = "none";
            document.getElementById("received").style.display = "block";

            alert("Đã nhận!");
        });
}

</script>

</body>
</html>
