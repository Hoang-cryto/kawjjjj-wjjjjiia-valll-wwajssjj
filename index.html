<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free thẻ Garena</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #111827,
        #2563eb,
        #7c3aed
    );

    background-size: 300% 300%;
    animation: backgroundMove 8s infinite ease;
}

@keyframes backgroundMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

.box {
    width: 90%;
    max-width: 420px;

    padding: 30px 25px;

    border-radius: 25px;

    background: rgba(0, 0, 0, 0.4);

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.4);

    color: white;

    text-align: center;
}


/* =====================
   THÔNG BÁO
===================== */

#welcome h1 {
    font-size: 28px;
    margin-bottom: 15px;
}

#welcome p {
    color: #ddd;
    line-height: 1.6;
    margin-bottom: 25px;
}

.continue {
    width: 100%;

    padding: 15px;

    border: none;
    border-radius: 15px;

    background: #2563eb;

    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.continue:hover {
    background: #1d4ed8;
}

.continue:active {
    transform: scale(.95);
}


/* =====================
   TRANG CHÍNH
===================== */

#main {
    display: none;
}

#main h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.description {
    color: #ddd;
    margin-bottom: 25px;
}


/* =====================
   NÚT SAO CHÉP
===================== */

.copy-buttons {
    display: flex;
    flex-direction: column;

    gap: 15px;
}

.copy-btn {
    width: 100%;

    padding: 16px;

    border: none;
    border-radius: 15px;

    background: linear-gradient(
        135deg,
        #16a34a,
        #22c55e
    );

    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.copy-btn:hover {
    transform: translateY(-2px);

    filter: brightness(1.1);
}

.copy-btn:active {
    transform: scale(.95);
}


/* Thông báo nhỏ sau khi sao chép */

#toast {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0,0,0,.85);

    color: white;

    padding: 13px 20px;

    border-radius: 12px;

    display: none;

    font-size: 15px;

    z-index: 100;
}
</style>
</head>


<body>

<div class="box">


    <!-- =====================
         THÔNG BÁO CHÀO MỪNG
    ====================== -->

    <div id="welcome">

        <h1>👋 Chào mừng bạn!</h1>

        <p>
            Chào mừng bạn đến với
            <b>web của Văn Kiều đẹp trai</b> 😎
        </p>

        <button
            class="continue"
            onclick="enterWeb()">

            Tiếp tục 🚀

        </button>

    </div>



    <!-- =====================
         TRANG CHÍNH
    ====================== -->

    <div id="main">

        <h1>🎁 Free thẻ Garena</h1>

        <p class="description">
            Bấm nút bên dưới để sao chép
        </p>


        <div class="copy-buttons">

            <button
                class="copy-btn"
                onclick="copyText('4375639900901138')">

                📋 Sao chép mã

            </button>


            <button
                class="copy-btn"
                onclick="copyText('868991220')">

                📋 Sao chép Seri

            </button>

        </div>

    </div>

</div>


<!-- Thông báo sao chép -->

<div id="toast">
    ✅ Đã sao chép!
</div>



<script>

/* =====================
   NÚT TIẾP TỤC
===================== */

function enterWeb() {

    document.getElementById("welcome").style.display = "none";

    document.getElementById("main").style.display = "block";

}



/* =====================
   SAO CHÉP
===================== */

function copyText(text) {

    navigator.clipboard.writeText(text)
        .then(function() {

            showToast("✅ Đã sao chép " + text + "!");

        })
        .catch(function() {

            // Cách sao chép dự phòng
            const input = document.createElement("textarea");

            input.value = text;

            document.body.appendChild(input);

            input.select();

            document.execCommand("copy");

            input.remove();

            showToast("✅ Đã sao chép " + text + "!");

        });

}



/* =====================
   TOAST
===================== */

function showToast(message) {

    const toast = document.getElementById("toast");

    toast.innerText = message;

    toast.style.display = "block";


    setTimeout(function() {

        toast.style.display = "none";

    }, 1800);

}

</script>

</body>
</html>
